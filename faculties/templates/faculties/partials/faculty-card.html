{% load static %}
<li class="flex flex-col overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-sm">
    <img src="{% static image %}" alt="" loading="lazy" width="640" height="400"
        class="h-48 w-full object-cover" />
    <div class="flex flex-col flex-1 p-6">
        <h3 class="text-xl font-bold text-blue-900">{{ name }}</h3>
        <p class="mt-4 text-base leading-7 text-gray-600">{{ description }}</p>
        <div style="margin-top: auto; padding-top: 1.5rem;">
            <a href="{% url route %}"
                class="inline-flex items-center gap-2 font-semibold text-blue-700 hover:text-blue-900 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-yellow-400"
                aria-label="Découvrir la faculté : {{ name }}">
                Découvrir la faculté <span aria-hidden="true">→</span>
            </a>
        </div>
    </div>
</li>
