<!DOCTYPE html>
<html lang="fr" data-theme="black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chargement - Dunia</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
    
    <style>
        /* Animation de flottement pour le logo */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        /* Effet de lueur bleue */
        .glow {
            filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5));
        }
    </style>
</head>
<body class="bg-slate-950 text-white min-h-screen overflow-hidden">

    <!-- ÉCRAN DE CHARGEMENT -->
    <div id="loader-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center transition-opacity duration-500 ease-in-out">
        
        <div class="text-center max-w-md px-6">
            
            <!-- Logo (SVG ou Image) -->
            <div class="animate-float glow mx-auto mb-8 w-28 h-28">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M 50 10 C 20 10 10 40 10 50 C 10 50 10 80 50 80 C 75 80 85 60 85 50 C 85 30 75 10 50 10" stroke="white" stroke-width="12" stroke-linecap="round" fill="none"/>
                    <path d="M 30 55 L 45 70" stroke="#1E90FF" stroke-width="14" stroke-linecap="round"/>
                    <circle cx="50" cy="50" r="8" fill="#1E90FF" />
                </svg>
            </div>

            <!-- Titre -->
            <h1 class="text-5xl font-extrabold tracking-tight text-white mb-2">Dunia</h1>
            <p class="text-slate-400 tracking-[0.2em] uppercase text-sm mb-10">E-Learning Platform</p>

            <!-- Barre de progression dynamique -->
            <div class="flex flex-col items-center gap-4">
                <progress id="progress-bar" class="progress progress-primary w-56" value="0" max="100"></progress>
                <p id="status-text" class="text-xs text-slate-500 font-medium">Chargement de vos cours... 0%</p>
            </div>

        </div>
    </div>

    <!-- CONTENU PRINCIPAL DE L'APP (Caché au début) -->
    <div id="main-content" class="hidden min-h-screen flex items-center justify-center">
        <div class="bg-slate-900 p-10 rounded-box shadow-2xl border border-slate-800 text-center">
            <h2 class="text-3xl font-bold text-blue-500 mb-4">Bienvenue sur Dunia !</h2>
            <p class="text-slate-300">Votre application est prête. Le chargement est terminé.</p>
        </div>
    </div>

    <!-- SCRIPT JAVASCRIPT -->
    <script>
        // Attendre que le DOM soit chargé
        document.addEventListener('DOMContentLoaded', () => {
            
            const progressBar = document.getElementById('progress-bar');
            const statusText = document.getElementById('status-text');
            const loaderScreen = document.getElementById('loader-screen');
            const mainContent = document.getElementById('main-content');

            let progress = 0;

            // Simulation du chargement (increments aléatoires pour un effet naturel)
            const interval = setInterval(() => {
                
                // On ajoute entre 1 et 5 points de pourcentage à chaque tick
                progress += Math.floor(Math.random() * 5) + 1;
                
                // Si on dépasse 100, on bloque à 100
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);

                    // On change le texte de fin
                    statusText.textContent = "Préparation de votre espace... 100%";
                    statusText.classList.add('text-blue-400'); // Petit changement de couleur
                    
                    // Petite pause avant la transition (500ms)
                    setTimeout(() => {
                        // Disparition en fondu de l'écran de chargement
                        loaderScreen.classList.add('opacity-0');
                        
                        // Une fois le fondu terminé (500ms), on cache totalement et on affiche le contenu
                        setTimeout(() => {
                            loaderScreen.classList.add('hidden');
                            mainContent.classList.remove('hidden');
                            mainContent.classList.add('flex'); // Pour recentrer le contenu
                        }, 500);

                    }, 600);

                } else {
                    // Mise à jour en temps réel
                    progressBar.value = progress;
                    statusText.textContent = `Chargement de vos cours... ${progress}%`;
                }
                
            }, 100); // Mise à jour toutes les 100ms
        });
    </script>

</body>
</html>
